<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专注时钟 · FocusFlow</title>
<meta name="description" content="番茄工作法计时器 + 任务清单，数据保存在本地，纯静态、免登录。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>⏱️</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">⏱️</span>
      <div>
        <h1>专注时钟</h1>
        <p class="sub">FocusFlow · 番茄工作法 · 数据只存在本机</p>
      </div>
    </div>
    <div class="actions">
      <button id="notifyBtn" class="ghost" type="button" title="开启结束提醒">🔔 提醒</button>
      <button id="themeBtn" class="ghost" type="button" title="切换主题">🌙</button>
    </div>
  </header>

  <main class="grid">

    <section class="card timer-card">
      <div class="modes" role="tablist">
        <button class="mode active" data-mode="focus" type="button">专注</button>
        <button class="mode" data-mode="short" type="button">短休息</button>
        <button class="mode" data-mode="long" type="button">长休息</button>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="ring-bg" cx="120" cy="120" r="104"></circle>
          <circle id="ringFg" class="ring-fg" cx="120" cy="120" r="104"></circle>
        </svg>
        <div class="ring-center">
          <div id="timeText" class="time">25:00</div>
          <div id="phaseText" class="phase">专注</div>
          <div id="taskNow" class="tasknow">未选择任务</div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="resetBtn" type="button">重置</button>
        <button id="skipBtn" type="button">跳过</button>
      </div>

      <details class="custom">
        <summary>自定义时长</summary>
        <div class="custom-grid">
          <label>专注 <input id="focusMin" type="number" min="1" max="180" value="25"> 分</label>
          <label>短休 <input id="shortMin" type="number" min="1" max="60" value="5"> 分</label>
          <label>长休 <input id="longMin" type="number" min="1" max="60" value="15"> 分</label>
          <label>长休间隔 <input id="longEvery" type="number" min="2" max="12" value="4"> 个番茄</label>
        </div>
      </details>

      <p class="hint">快捷键：<kbd>空格</kbd> 开始 / 暂停 ・ <kbd>R</kbd> 重置</p>
    </section>

    <section class="card tasks-card">
      <h3>任务清单 <span id="taskMeta" class="muted"></span></h3>
      <form id="taskForm" class="taskform" autocomplete="off">
        <input id="taskInput" type="text" placeholder="添加一个任务，回车确认" aria-label="任务名称">
        <button class="primary" type="submit">添加</button>
      </form>
      <ul id="taskList" class="tasks"></ul>
      <p class="hint">点击任务左侧圆点选中为「当前任务」，专注时长会自动累计到它上面。</p>
    </section>

    <section class="card stats-card">
      <h3>统计</h3>
      <div id="stats" class="stats"></div>
      <h4 class="mt">最近 7 天专注时长</h4>
      <div id="week" class="week"></div>
    </section>

  </main>

  <footer class="foot">
    <span>所有数据保存在浏览器本地（localStorage），不联网、不上传。</span>
    <span id="saveHint" class="muted"></span>
  </footer>

</div>
<script src="assets/app.js"></script>
</body>
</html>
